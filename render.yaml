envVarGroups:
  - name: livesun-central-secrets
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
      - key: JWT_SECRET
      - key: ENCRYPTION_KEY
      - key: DB_ENGINE
        value: postgresql
      - key: DATABASE_URL
      - key: RATELIMIT_STORAGE_URI
      - key: WEBHOOK_ALLOWED_HOSTS
        value: propostas.livesun.com.br,app.livesun.com.br
      - key: WEBHOOK_ALLOW_LOCAL_HTTP
        value: 'false'
      - key: TRUST_PROXY
        value: 'true'
      - key: SSH_ENABLED
        value: 'true'
      - key: SSH_HOST
        value: wagner.montudb.com
      - key: SSH_USER
        value: opc
      - key: SSH_PORT
        value: '22'
      - key: SSH_REMOTE_PORT
        value: '55433'
      - key: SSH_LOCAL_PORT
        value: '55433'
      - key: SSH_KEY_PATH
        value: /etc/secrets/SKey
      - key: SSH_KNOWN_HOSTS_PATH
        value: /app/deploy/montudb_known_hosts
      - key: SSH_STARTUP_TIMEOUT_SECONDS
        value: '90'
services:
  - type: web
    name: livesun-central
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: 'off'
    dockerCommand: python scripts/with_ssh_tunnel.py web
    healthCheckPath: /api/v1/health
    envVars:
      - fromGroup: livesun-central-secrets
# Free não oferece Background Worker. Filas exigem worker separado;
# não são ativadas automaticamente no processo web.